<style>
  /* Change cursor on equation tags to signal interactivity */
  .mjx-tag, .katex-tag, [id^="eq-"] .tag {
    cursor: pointer !important;
  }
  .mjx-tag:hover, .katex-tag:hover {
    opacity: 0.7;
  }
</style>

<script>
window.addEventListener("load", function() {
  const setupEquationCopy = () => {
    // Find all equation containers generated by Quarto with an 'eq-' ID
    document.querySelectorAll('[id^="eq-"]').forEach(container => {
      const eqId = container.getAttribute('id');
      const labelText = `@${eqId}`;
      
      // Locate the rendered tag element inside MathJax or KaTeX
      const tag = container.querySelector('.mjx-tag, .katex-tag, .tag') || container;
      
      // Set hover title to display the label name
      tag.setAttribute('title', `📋 ${labelText}`);
      
      // Copy label to clipboard on click
      tag.addEventListener('click', (e) => {
        e.stopPropagation();
        navigator.clipboard.writeText(labelText).then(() => {
          showToast(`Copied ${labelText} to clipboard!`);
        });
      });
    });
  };

  // Wait for MathJax/KaTeX rendering before attaching listeners
  if (window.MathJax && window.MathJax.startup) {
    window.MathJax.startup.promise.then(setupEquationCopy);
  } else {
    setupEquationCopy();
  }

  function showToast(message) {
    let toast = document.getElementById('eq-copy-toast');
    if (!toast) {
      toast = document.createElement('div');
      toast.id = 'eq-copy-toast';
      toast.style.cssText = 'position:fixed; bottom:20px; right:20px; background:#1e293b; color:#ffffff; padding:8px 14px; border-radius:6px; font-family:sans-serif; font-size:13px; z-index:9999; transition:opacity 0.3s; opacity:0; pointer-events:none; box-shadow:0 4px 6px -1px rgba(0,0,0,0.1);';
      document.body.appendChild(toast);
    }
    toast.textContent = message;
    toast.style.opacity = '1';
    setTimeout(() => { toast.style.opacity = '0'; }, 2000);
  }
});
</script>
