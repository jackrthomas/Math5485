    <div id="course-announcement-banner" class="announcement-banner" role="region" aria-label="Course updates">
      <span class="banner-label">📢 <strong>Updates</strong></span>
      <div class="banner-ticker">
        <div class="banner-ticker-track">
          <!-- ── Add updates here: one <span> per update with its date as data-date="YYYY-MM-DD".
                 * Order doesn't matter: updates are sorted by date (newest first).
                 * Updates dated in the future are hidden until that day (so you can schedule them).
                 * Only the newest few scroll (MAX_SCROLLING below); all are listed under "All updates". ── -->
          <span class="banner-item" data-date="2026-09-24">Quiz 1 solutions online</span>
          <span class="banner-item" data-date="2026-09-24">Lectures 2-3 exercises have solutions!</span>
          <span class="banner-item" data-date="2026-09-23">Lecture 1 exercises have solutions!</span>
        </div>
      </div>
      <button class="banner-more-btn" type="button" aria-expanded="false" aria-controls="banner-all-updates" hidden>All updates</button>
      <button class="banner-close-btn" onclick="closeBanner()" aria-label="Close updates">&times;</button>
      <div id="banner-all-updates" class="banner-all" hidden>
        <div class="banner-all-title">All updates</div>
        <ul class="banner-all-list"></ul>
      </div>
    </div>
    <style>
      .announcement-banner {
        background-color: #007bff;
        color: white;
        padding: 8px 12px;
        position: relative;
        font-size: 0.95rem;
        z-index: 1000;
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 0.75rem;   /* space between the banner and the page below */
      }
      .banner-label {
        flex-shrink: 0;
        white-space: nowrap;
      }
      /* scrolling area: fades out at both ends */
      .banner-ticker {
        flex-grow: 1;
        overflow: hidden;
        white-space: nowrap;
        -webkit-mask-image: linear-gradient(to right, transparent, #000 4%, #000 96%, transparent);
                mask-image: linear-gradient(to right, transparent, #000 4%, #000 96%, transparent);
      }
      .banner-ticker-track {
        display: inline-flex;
        white-space: nowrap;
        will-change: transform;
      }
      .banner-ticker.scrolling .banner-ticker-track {
        animation: banner-scroll var(--banner-duration, 30s) linear infinite;
      }
      /* pause while the mouse is over the text, so it can be read */
      .banner-ticker:hover .banner-ticker-track {
        animation-play-state: paused;
      }
      .banner-item {
        padding: 0 1.5rem;
      }
      .banner-date {
        display: inline-block;
        font-size: 0.8em;
        font-weight: 600;
        background: rgba(255, 255, 255, 0.2);
        border-radius: 4px;
        padding: 0 6px;
        margin-right: 6px;
      }
      .banner-item::before {
        content: "•";
        margin-right: 1.5rem;
        opacity: 0.7;
      }
      @keyframes banner-scroll {
        from { transform: translateX(0); }
        to   { transform: translateX(-50%); }   /* the track holds two identical halves */
      }
      /* visitors who prefer reduced motion: no scrolling, show the updates as a static list */
      @media (prefers-reduced-motion: reduce) {
        .banner-ticker { -webkit-mask-image: none; mask-image: none; white-space: normal; }
        .banner-ticker-track { display: flex; flex-wrap: wrap; animation: none !important; }
      }
      /* "All updates" button and drop-down list */
      .banner-more-btn {
        flex-shrink: 0;
        background: rgba(255, 255, 255, 0.15);
        border: 1px solid rgba(255, 255, 255, 0.6);
        color: white;
        border-radius: 999px;
        font-size: 0.8rem;
        padding: 2px 10px;
        cursor: pointer;
        white-space: nowrap;
      }
      .banner-more-btn:hover,
      .banner-more-btn[aria-expanded="true"] {
        background: white;
        color: #007bff;
      }
      .banner-all {
        position: absolute;
        top: 100%;
        right: 12px;
        margin-top: 6px;
        width: min(420px, calc(100vw - 24px));
        max-height: 60vh;
        overflow-y: auto;
        background: white;
        color: #212529;
        border: 1px solid #dee2e6;
        border-radius: 8px;
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.15);
        padding: 10px 14px;
        text-align: left;
        z-index: 1001;
      }
      .banner-all[hidden] { display: none; }
      .banner-all-title {
        font-weight: 600;
        margin-bottom: 6px;
      }
      .banner-all-list {
        list-style: none;
        margin: 0;
        padding: 0;
      }
      .banner-all-list li {
        padding: 5px 0;
        border-top: 1px solid #f1f3f5;
      }
      .banner-all-list li:first-child { border-top: none; }
      .banner-all-list li.banner-all-date {
        font-size: 0.78rem;
        font-weight: 600;
        color: #6c757d;
        border-top: none;
        padding: 8px 0 2px;
      }
      .banner-all-list li.banner-all-date:first-child { padding-top: 0; }
      .banner-close-btn {
        flex-shrink: 0;
        background: none;
        border: none;
        color: white;
        font-size: 1.4rem;
        cursor: pointer;
        line-height: 1;
        padding: 0 8px;
        opacity: 0.8;
      }
      .banner-close-btn:hover {
        opacity: 1;
      }
    </style>
    <script>
      // Hide immediately if already dismissed in this browser session
      if (sessionStorage.getItem('hideCourseBanner') === 'true') {
        document.write('<style>#course-announcement-banner { display: none !important; }</style>');
      }

      function closeBanner() {
        var banner = document.getElementById('course-announcement-banner');
        if (banner) {
          banner.style.display = 'none';
        }
        // Remember that the user closed it during this browser session
        sessionStorage.setItem('hideCourseBanner', 'true');
      }

      // Scrolling ticker: repeat the updates until they fill the banner, then duplicate
      // the whole set so the animation (which moves the track by half its width) loops seamlessly.
      (function () {
        var SPEED = 60;          // pixels per second
        var MAX_SCROLLING = 3;   // how many of the newest updates scroll; the rest are under "All updates"

        // Dates: "YYYY-MM-DD" → local date (no timezone shift); shown as Today / Yesterday / "Wed, Sep 23"
        function parseDate(str) {
          var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec((str || '').trim());
          return m ? new Date(+m[1], +m[2] - 1, +m[3]) : null;
        }
        function dateLabel(d) {
          var today = new Date(); today.setHours(0, 0, 0, 0);
          var days = Math.round((today - d) / 86400000);
          if (days === 0) return 'Today';
          if (days === 1) return 'Yesterday';
          var opts = { weekday: 'short', month: 'short', day: 'numeric' };
          if (d.getFullYear() !== today.getFullYear()) opts.year = 'numeric';
          return d.toLocaleDateString('en-US', opts);
        }

        // Sort the updates by date, hide future ones, keep the newest few in the ticker
        // (with a date label) and list all of them, grouped by date, under "All updates".
        function setupUpdates(track) {
          var banner = document.getElementById('course-announcement-banner');
          var btn = banner.querySelector('.banner-more-btn');
          var panel = banner.querySelector('.banner-all');
          var list = panel.querySelector('.banner-all-list');
          var today = new Date(); today.setHours(0, 0, 0, 0);

          var updates = Array.prototype.slice.call(track.querySelectorAll('.banner-item')).map(function (el, i) {
            return { html: el.innerHTML, date: parseDate(el.getAttribute('data-date')), order: i };
          }).filter(function (u) {
            return !u.date || u.date <= today;                       // scheduled updates stay hidden
          }).sort(function (a, b) {
            if (a.date && b.date && +a.date !== +b.date) return b.date - a.date;   // newest first
            if (!a.date !== !b.date) return a.date ? -1 : 1;                       // undated last
            return a.order - b.order;                                              // same day: file order
          });

          // ticker: the newest MAX_SCROLLING updates, each with its date
          track.innerHTML = '';
          updates.slice(0, MAX_SCROLLING).forEach(function (u) {
            var span = document.createElement('span');
            span.className = 'banner-item';
            span.innerHTML = (u.date ? '<span class="banner-date">' + dateLabel(u.date) + '</span>' : '') + u.html;
            track.appendChild(span);
          });
          if (updates.length === 0) { banner.style.display = 'none'; return; }

          // drop-down: everything, grouped by date
          var lastLabel = null;
          updates.forEach(function (u) {
            var label = u.date ? dateLabel(u.date) : 'Other';
            if (label !== lastLabel) {
              var h = document.createElement('li');
              h.className = 'banner-all-date';
              h.textContent = label;
              list.appendChild(h);
              lastLabel = label;
            }
            var li = document.createElement('li');
            li.innerHTML = u.html;
            list.appendChild(li);
          });
          if (updates.length <= MAX_SCROLLING) return;   // everything already scrolls: no button needed

          btn.textContent = 'All updates (' + updates.length + ')';
          btn.hidden = false;

          function setOpen(open) {
            panel.hidden = !open;
            btn.setAttribute('aria-expanded', open ? 'true' : 'false');
          }
          btn.addEventListener('click', function (e) {
            e.stopPropagation();
            setOpen(panel.hidden);
          });
          panel.addEventListener('click', function (e) { e.stopPropagation(); });
          document.addEventListener('click', function () { setOpen(false); });
          document.addEventListener('keydown', function (e) { if (e.key === 'Escape') setOpen(false); });
        }

        function startTicker() {
          var ticker = document.querySelector('#course-announcement-banner .banner-ticker');
          if (!ticker) return;
          var track = ticker.querySelector('.banner-ticker-track');
          setupUpdates(track);
          if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

          var items = Array.prototype.slice.call(track.querySelectorAll('.banner-item'));
          if (items.length === 0) return;

          // one "half": the updates repeated until they are at least as wide as the banner
          var guard = 0;
          while (track.scrollWidth < ticker.clientWidth && guard++ < 50) {
            items.forEach(function (item) {
              var copy = item.cloneNode(true);
              copy.setAttribute('aria-hidden', 'true');
              track.appendChild(copy);
            });
          }
          // second half: an exact copy of the first
          Array.prototype.slice.call(track.children).forEach(function (el) {
            var copy = el.cloneNode(true);
            copy.setAttribute('aria-hidden', 'true');
            track.appendChild(copy);
          });

          var halfWidth = track.scrollWidth / 2;
          ticker.style.setProperty('--banner-duration', (halfWidth / SPEED) + 's');
          ticker.classList.add('scrolling');
        }

        if (document.readyState === 'complete') startTicker();
        else window.addEventListener('load', startTicker);
      })();
    </script>
