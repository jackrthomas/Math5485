project:
  type: book
  output-dir: _book
  pre-render: extras/run-collect-exercises.py   # rebuilds exercises/exercises.qmd

comments: 
  hypothesis:
    theme: clean

book:
  title: "Math5485"
  subtitle: "Introduction to Numerical Methods I"
  author: "Jack Thomas"
  date: today
  favicon: images/pi.ico
  cover-image: images/PCA-5485-2.gif
  
  repo-url: https://github.com/jackrthomas/Math5485
  repo-branch: main
  repo-actions: [edit]

  sidebar:
    search: true
    tools:
    - icon: question-circle
      text: "Ask a Question"
      href: "https://github.com/jackrthomas/Math5485/issues/new?template=question.md"
    - icon: stopwatch
      text: "Timer"
      href: "#timer"

  chapters:
    - index.qmd

    - part: "Lectures"
      chapters:
      - lectures/L01.ipynb
      - lectures/L02.ipynb
      - lectures/L03.ipynb
      - lectures/L04.ipynb
      - lectures/L05.ipynb
      - lectures/L06.ipynb
      - lectures/L07.ipynb
      - lectures/L08.ipynb
      - lectures/L09.ipynb
      - lectures/L10.ipynb
      - lectures/L11.ipynb

    - exercises/bank.ipynb

    - part: "Assignments"
      number-sections: false
      chapters:
      - assignments/A01.ipynb
      - assignments/A02.ipynb
      - assignments/A03.ipynb

    - part: "Appendix"
      chapters: 
      - appendix/calculus.ipynb
  
    - part: "Admin"
      chapters: 
      - appendix/syllabus.ipynb
      - appendix/schedule.qmd 
      - appendix/installing-julia.ipynb
      - appendix/presentation-topics.ipynb
    
    - references.qmd

language:
  search-no-results-text: "No results"
  repo-action-links-issue: "Ask a question"

website:
  site-url: "https://jackrthomas.github.io/Math5485/"

execute:
  freeze: auto
  keep-ipynb: true

bibliography: references.bib

crossref:
  eq-prefix: ""

filters:
  - at: pre-ast
    path: extras/collapse-proofs.lua
  - at: pre-ast
    path: extras/draft-solutions.lua   # .draft hints/solutions: private build only
  - at: pre-ast
    path: extras/difficult.lua   # ◆ on exercises marked .difficult
  - at: post-quarto
    path: extras/eq-parens.lua
  - at: post-quarto
    path: extras/split-refs.lua   # books and papers as separate lists

format:
  html:
    theme: cosmo
    code-fold: show
    crossrefs-hover: true
    include-before-body: extras/_banner.html
    include-after-body:
      - extras/tags.html
      - extras/timer.html
      - extras/theorem-titles.html
    code-tools:
      source: true           
      toggle: true
    format-links: [ipynb]
    comments:
      hypothesis: true
    css: style.css
