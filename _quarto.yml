project:
  type: book
  output-dir: _book

resources:
  - "*.ipynb"
  - "**/*.ipynb"

comments: 
  hypothesis:
    theme: clean

book:
  title: "Math5485"
  subtitle: "Introduction to Numerical Methods I"
  author: "Jack Thomas"
  date: today
  downloads: [pdf]
  
  repo-url: https://github.com/jackrthomas/Math5485
  repo-branch: main
  repo-actions: [edit]

  sidebar:
      style: "docked"
      search: true
      tools:
      - icon: question-circle
        text: "Ask a Question"
        href: "https://github.com/jackrthomas/Math5485/issues/new?template=question.md"

  chapters:
    - index.qmd

    - part: "Lectures"
      chapters:
        - lecture01.ipynb

    - part: "Appendices"
    - part: "Problem Classes"
    - part: "Assignments"
    - part: "Exams"
    
  appendices: 
    - part: "Admin"
      chapters:
        - syllabus.qmd

    - references.qmd

language:
  search-no-results-text: "No results"
  repo-action-links-issue: "Ask a question"

website:
  site-url: "https://jackrthomas.github.io/Math5485/"

execute:
  freeze: auto
  keep-ipynb: true

bibliography: references.bib

format:
  html:
    theme: cosmo
    code-fold: show
    code-tools:
      source: true           
      toggle: true
    format-links: [ipynb]
    comments:
      hypothesis: true

  pdf:
    documentclass: scrreprt
    toc: true
    number-sections: true
    classoption:
      - open=any
    colorlinks: true
    include-in-header:
      text: |
        \makeatletter
        \def\@endpart{\bigbreak}
        \makeatother