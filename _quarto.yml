project:
  type: book
  output-dir: _book

comments: 
  hypothesis:
    theme: clean

book:
  title: "Math5485"
  subtitle: "Introduction to Numerical Methods I"
  author: "Jack Thomas"
  date: today
  favicon: images/pi.ico
  cover-image: images/PCA-5485-2.gif
  
  repo-url: https://github.com/jackrthomas/Math5485
  repo-branch: main
  repo-actions: [edit]

  sidebar:
    search: true
    tools:
    - icon: question-circle
      text: "Ask a Question"
      href: "https://github.com/jackrthomas/Math5485/issues/new?template=question.md"

  chapters:
    - index.qmd

    - part: "Lectures"
      chapters:
      - lectures/L01.ipynb
      - lectures/L02.ipynb
      - lectures/L03.ipynb
      - lectures/L04.ipynb
      - lectures/L05.ipynb

    - part: "Exercises"
      chapters:
      - exercises/bank.ipynb
      - exercises/test-sample.ipynb
      - exercises/Q1.ipynb

    - part: "Assignments"
      number-sections: false
      chapters:
      - assignments/A01.ipynb
      - assignments/A02.ipynb
      
    - part: "Exams" 

  appendices: 
    - appendix/syllabus.ipynb
    - appendix/installing-julia.ipynb
    - references.qmd

language:
  search-no-results-text: "No results"
  repo-action-links-issue: "Ask a question"

website:
  site-url: "https://jackrthomas.github.io/Math5485/"

execute:
  freeze: auto
  keep-ipynb: true

bibliography: references.bib

format:
  html:
    theme: cosmo
    code-fold: show
    crossrefs-hover: true
    include-before-body: extras/_banner.html
    include-after-body: extras/tags.html
    code-tools:
      source: true           
      toggle: true
    format-links: [ipynb]
    comments:
      hypothesis: true
    css: style.css
