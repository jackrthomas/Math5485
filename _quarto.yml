project:
  type: book
  output-dir: _book

#resources:
#  - "*.ipynb"
#  - "**/*.ipynb"

comments: 
  hypothesis:
    theme: clean

book:
  title: "Math5485"
  subtitle: "Introduction to Numerical Methods I"
  author: "Jack Thomas"
  date: today
  favicon: images/pi.ico
  cover-image: images/PCA-5485-2.gif
  # downloads: [pdf]
  
  repo-url: https://github.com/jackrthomas/Math5485
  repo-branch: main
  repo-actions: [edit]

  sidebar:
      search: true
      tools:
      - icon: question-circle
        text: "Ask a Question"
        href: "https://github.com/jackrthomas/Math5485/issues/new?template=question.md"

  chapters:
    - index.qmd

    - part: "Lectures"
      chapters:
      - L01.ipynb
    - part: "Problem Classes"
    - part: "Assignments"
    - part: "Exams"
     
  appendices: 
    - appendix/syllabus.ipynb
    - appendix/installing-julia.ipynb
    - references.qmd

language:
  search-no-results-text: "No results"
  repo-action-links-issue: "Ask a question"

website:
  site-url: "https://jackrthomas.github.io/Math5485/"

execute:
  freeze: auto
  keep-ipynb: true

bibliography: references.bib

format:
  html:
    theme: cosmo
    code-fold: show
    code-tools:
      source: true           
      toggle: true
    format-links: [ipynb]
    comments:
      hypothesis: true
    css: style.css

